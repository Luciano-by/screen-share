# STEP-010: configuração de referência do coturn (servidor TURN).
#
# Instalação SEM Docker, via apt (Ubuntu):
#   sudo apt install coturn
#   sudo cp turnserver.conf /etc/turnserver.conf
#   sudo systemctl enable --now coturn
#
# O segredo abaixo (TURN_SECRET) precisa ser EXATAMENTE o mesmo valor
# usado na variável de ambiente TURN_SECRET do backend — é ele que
# permite ao backend gerar credenciais TURN de curta duração que o
# coturn aceita (mecanismo "REST API" / use-auth-secret do coturn).

# Portas padrão TURN/STUN
listening-port=3478
tls-listening-port=5349

# IP público do servidor (preencher na hora do deploy)
# external-ip=SEU_IP_PUBLICO

# Faixa de portas para relay de mídia — abrir essas portas UDP no firewall
min-port=49152
max-port=65535

# Nome do "realm" (qualquer identificador, ex: o domínio do projeto)
realm=screen-share.exemplo.com

# --- Autenticação efêmera (REST API do coturn) ---
# O backend gera usuário/senha de curta duração via HMAC-SHA1 usando
# esse mesmo segredo (ver backend/src/server.ts, TURN_SECRET).
use-auth-secret
static-auth-secret=TROQUE_ESTE_VALOR_E_USE_O_MESMO_NO_BACKEND

# Certificado TLS (necessário para turns:// — recomendado em produção,
# já que a maioria dos navegadores só usa TURN sobre TLS/DTLS em
# contexto de página segura)
# cert=/etc/letsencrypt/live/seu-dominio/fullchain.pem
# pkey=/etc/letsencrypt/live/seu-dominio/privkey.pem

# Não expor a interface de administração do coturn
no-cli

# Não agir como servidor STUN "aberto" para qualquer um — só atende
# quem apresenta credencial válida
fingerprint
lt-cred-mech

# Log
log-file=/var/log/turnserver.log
verbose
