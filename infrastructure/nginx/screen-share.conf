# STEP-011: reverse proxy de produção (sem Docker).
#
# Serve o frontend (build estático do Vite) direto pelo Nginx e
# encaminha sinalização (WebSocket) e as duas rotas HTTP simples do
# backend (/health, /turn-credentials). TLS via Certbot (Let's Encrypt).
#
# Instalação:
#   sudo cp screen-share.conf /etc/nginx/sites-available/screen-share.conf
#   sudo ln -s /etc/nginx/sites-available/screen-share.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d screen-share.exemplo.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name screen-share.exemplo.com;

    # Certbot reescreve este bloco para redirecionar para HTTPS
    # automaticamente (opção --nginx). Deixado explícito aqui como
    # referência caso o certificado seja configurado manualmente.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name screen-share.exemplo.com;

    # Preenchido pelo Certbot (certbot --nginx) ou apontado manualmente:
    ssl_certificate     /etc/letsencrypt/live/screen-share.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screen-share.exemplo.com/privkey.pem;

    # getDisplayMedia só funciona em contexto seguro (HTTPS) — por
    # isso TLS não é opcional aqui, é pré-requisito funcional.

    root /var/www/screen-share/frontend;
    index index.html;

    # SPA: qualquer rota não encontrada como arquivo cai no index.html
    # (o roteamento de /s/:roomId é feito no lado do cliente, pelo
    # react-router-dom).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Sinalização WebSocket (backend/src/server.ts)
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sinalização precisa ficar aberta enquanto durar a sessão —
        # não é uma requisição HTTP curta.
        proxy_read_timeout 3600s;
    }

    # Rotas HTTP simples do backend
    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location /turn-credentials {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
}
